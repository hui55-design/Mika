name: Auto sync fork

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: TGhack233/sync-fork@main
        with:
          upstream: wangzan101/Mika
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}
